name: Core and integration contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pdfplumber==0.11.9
      - name: Research core (no credentials)
        run: >-
          PYTHONPATH=src:. python -B -m unittest
          tests.test_research_workspace tests.test_research_modes
          tests.test_research_methodology tests.test_research_journal
          tests.test_research_capabilities tests.test_research_handoff
          tests.test_research_fetch tests.test_run_research tests.test_native_audit
      - name: Foundation contracts (live Dolt tests skip when unavailable)
        working-directory: components/foundation
        run: PYTHONPATH="src:$GITHUB_WORKSPACE/src" python -B -m unittest discover -s tests

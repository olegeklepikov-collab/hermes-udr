[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-research-report"
version = "0.44.0b1"
description = "Wide and deep research with native Hermes agents and a shared evidence corpus"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "Hermes Research Project"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_research_report = ["py.typed"]

[tool.ruff.lint]
# The deployable plugin directory intentionally follows the Hermes slug format.
ignore = ["N999"]
